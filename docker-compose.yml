name: str-mixture-adjudicator

services:
  web:
    build: .
    image: str-mixture-adjudicator:latest
    ports:
      # 宿主机端口可通过环境变量 HOST_PORT 配置，默认 8000
      - "${HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # 一次性验证服务：等待 web 健康后运行代码测试 + HTTP 冒烟，
  # 随后自行退出并以退出码报告结果（0 通过 / 非 0 失败）。
  verify:
    image: str-mixture-adjudicator:latest
    build: .
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: http://web:8000
    command: ["sh", "-c", "python -m pytest tests -q && python scripts/smoke.py"]
